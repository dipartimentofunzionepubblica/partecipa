        csp_settings:
          connect_src: Connect-src
          connect_src_hint: |
            La direttiva connect-src limita gli URL che possono essere caricati utilizzando gli elementi <script>.
            La piattaforma aggiungerà 'self', ma ti permette di aggiungere di più. 
            Lascia il campo vuoto se non sei sicuro.
          default_src: Default src
          default_src_hint: |
            La direttiva default-src è il criterio predefinito per caricare contenuti come JavaScript, Immagini, CSS, Caratteri, richieste AJAX, Frames, Media HTML5.
            La piattaforma aggiungerà "'self' ''unsafe-inline'", ma ti permette di aggiungerne di più. 
            Lascia il campo vuoto se non sei sicuro.
          font_src: Font src
          font_src_hint: |
            La direttiva font-src limita gli URL che possono essere caricati usando @font-face.
            La piattaforma aggiungerà 'self', ma ti permette di aggiungere di più. 
            Lascialo il campo vuoto se non sei sicuro.
          frame_src: Frame src
          frame_src_hint: |
            La direttiva frame-src limita gli URL che possono essere caricati utilizzando gli elementi <frame>, <iframe> e <object>.
            La piattaforma aggiungerà 'self', ma ti permette di aggiungere di più. 
            Lascia il campo vuoto se non sei sicuro.
          img_src: Img src
          img_src_hint: |
            La direttiva img-src limita gli URL che possono essere caricati utilizzando gli elementi <img>, <image>, <picture> e <svg>.
            La piattaforma aggiungerà 'self', ma ti permette di aggiungere di più. 
            Lascia il campo vuoto se non sei sicuro.
          media_src: Media src
          media_src_hint: |
            La direttiva media-src limita gli URL che possono essere caricati utilizzando gli elementi <video>, <audio> e <source>.
            La piattaforma aggiungerà 'self', ma ti permette di aggiungere di più. 
            Lascia il campo vuoto se non sei sicuro.
          script_src: Script src
          script_src_hint: |
            La direttiva script-src limita gli URL che possono essere caricati usando gli elementi <script>.
            La piattaforma aggiungerà "'self' ''unsafe-inline' 'unsafe-eval'", ma ti permette di aggiungerne di più. 
            Lascia il campo vuoto se non sei sicuro.
          style_src: Style src
          style_src_hint: |
            The style-src directive restricts the URLs which can be loaded using <style> elements.
            The platform will add "'self' 'unsafe-inline'", but allows you to add more. leave it blank if you are unsure.
        edit:
