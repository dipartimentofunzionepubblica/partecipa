            destroying_private_data: "L'eliminazione dei dati privati per %{title} è stata avviata. Controlla di nuovo tra pochi minuti."
            done: Completato
            help_html: |
              Questo strumento consente di eliminare tutti i dati privati per uno specifico spazio partecipativo o componente. Questa azione è irreversibile e rimuoverà tutti i dati privati dal database.
              <br><br>
              <strong>Cosa sono considerati dati privati?</strong>
              <br>
              I dati privati sono tutte le informazioni che non sono disponibili pubblicamente e sono accessibili solo agli amministratori. Al momento, ciò include le informazioni dei campi personalizzati privati.
              <br><br>
              <strong>Cosa succede quando elimino i dati privati?</strong>
              <br>
              Quando elimini i dati privati, tutte le informazioni private per lo spazio partecipativo o il componente selezionato verranno rimosse permanentemente dal database. Un registro di questa azione verrà memorizzato nel sistema a fini di audit.
              <br><br>
              <strong>Cosa succede ai dati pubblici?</strong>
              <br>
              I dati pubblici non saranno influenzati da questa azione. Verranno eliminati solo i dati privati.
              <br><br>
              <strong>C'è un tempo minimo di attesa prima di eliminare i dati privati?</strong>
              <br>
              Sì, non è possibile eliminare i dati privati se l'ultimo aggiornamento è avvenuto meno di %{time_ago} fa. È possibile modificare questa configurazione nel file di inizializzazione.
            items_count: Totale interessati
