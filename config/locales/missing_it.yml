            La piattaforma aggiungerà 'self', ma ti consente di aggiungerne altri. Lascialo vuoto se non sei sicuro.
          img_src: Origine immagine
          img_src_hint: |-
            La direttiva img-src limita gli URL che possono essere caricati usando gli elementi <img>, <image>, <picture> e <svg>.
            La piattaforma aggiungerà 'self', ma ti consente di aggiungerne altri. Lascialo vuoto se non sei sicuro.
          media_src: Fonte dei media
          media_src_hint: |-
            La direttiva media-src limita gli URL che possono essere caricati usando gli elementi <video>, <audio> e <source>.
            La piattaforma aggiungerà 'self', ma ti consente di aggiungerne altri. Lascialo vuoto se non sei sicuro.
