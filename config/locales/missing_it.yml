              Questo strumento consente di eliminare tutti i dati privati per uno specifico spazio partecipativo o componente. Questa azione è irreversibile e rimuoverà tutti i dati privati dal database.
              <br><br>
              <strong>Cosa si intende per dati privati?</strong>
              <br>
              I dati privati sono tutte le informazioni che non sono disponibili al pubblico e sono accessibili solo agli amministratori. Questo, al momento, include le informazioni dei campi personalizzati privati.
              <br><br>
              <strong>Cosa succede quando elimino i dati privati?</strong>
              <br>
              Quando elimini i dati privati, tutte le informazioni private per lo spazio partecipativo o il componente selezionato verranno rimosse definitivamente dal database. Un registro di questa azione verrà archiviato nel sistema per scopi di controllo.
              <br><br>
              <strong>Cosa succede ai dati pubblici?</strong>
              <br>
              I dati pubblici non saranno interessati da questa azione. Verranno eliminati solo i dati privati. <br><br>
              <strong>Esiste un tempo minimo di attesa prima di eliminare i dati privati?</strong>
              <br>
              Sì, non puoi eliminare i dati privati se l'ultimo aggiornamento è avvenuto meno di %{time_ago} fa. Puoi modificare questa configurazione nel file di inizializzazione.
